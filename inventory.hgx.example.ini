# HGX B200/B300 example, based on inventory.hgx.ini (SMC / AVR PODs).
# Optional credentials template (no BCM required): ./gen_passwd.sh -o passwd.sh
# Fill credentials, then:
# ./nodetools inventory init --from hosts.list --passwd-file passwd.sh -o inventory.generated.ini
# Optional BCM host export: ./gen_hosts.sh -o hosts.bcm.list
# For the older generation, set generation=b200 and verify model-specific resources.
# cp inventory.hgx.example.ini inventory.ini
# Replace example BMC addresses and CHANGE_ME credentials.
# ./nodelist --by-group
# ./nodepsu --group SMC-L1POD2 --details
# ./nodetemp --group AVR-L5POD4 --summary
# ./nodetools inventory import host.list
# ./nodetools inventory import host.list --apply
# HGX uses node* commands; no NVSwitch or rack power-shelf role.

[compute]
HGX531 host=192.0.2.31
HGX532 host=192.0.2.32
HGX390 host=192.0.2.39
HGX391 host=192.0.2.40

# In BCM, substitute the actual HGX category name:
# cmsh -> category <HGX_CATEGORY> -> bmcsettings (compute BMC, also used for IPMI)
# Per-device overrides can be checked under the device's bmcsettings.
[compute:vars]
platform=hgx
generation=b300

[SMC]
HGX[531-532]

[SMC:vars]
oem=smc
bmc_user=ADMIN
bmc_password=CHANGE_ME_SMC
# Add verified chassis_id/system_id overrides per model, if needed.

[AVR]
HGX[390-391]

[AVR:vars]
oem=aivres
bmc_user=admin
bmc_password=CHANGE_ME_AVR
# Verified KR9288-X3 B300 host temperature resource:
temp_chassis_id=1

[SMC-L1POD2]
HGX[531-532]

[AVR-L5POD4]
HGX[390-391]

# IB / Ethernet fabric switches use OS management addresses, not NVLink BMCs.
# host.list import examples:
# IBSwitch ib-leaf01 192.0.2.61
# EthernetSwitch eth-leaf01 192.0.2.62
# SPXSwitch spx-leaf01 192.0.2.63
# Use NVSwitch for NVLink trays; Switch is its legacy import alias.
[switch]
ib-leaf01 host=192.0.2.61 ssh_user=admin
eth-leaf01 host=192.0.2.62 ssh_user=admin
spx-leaf01 host=192.0.2.63 ssh_user=cumulus

# SSH authentication uses the local OpenSSH configuration/keys.
# IB: ./ibswhc ib-leaf01 / ./ibswmon ib-leaf01
# Spectrum-X Ethernet: ./spxswhc spx-leaf01 / ./spxswmon spx-leaf01
# Other Ethernet platforms need their own command/backend adaptation.

[nodehealth:defaults]
jobs=24
timeout=10
node_timeout=40
redfish_timeout=8
redfish_connect_timeout=3
summary=false
