# nodetools inventory.ini 示例
# 新环境可复制本文件。192.0.2.x 都是示例 BMC 地址，部署时换成实际地址。
# 已经有 inventory.ini 时，保留现有定义，把需要的段加进去。
#
# 常用命令
#   ./nodelist --by-group
#   ./nodelist --by-group --group SMC-L1POD2
#   ./nodepsu --group AVR-L5POD4
#   ./nodetools inventory import /path/to/hosts.list          # 预览
#   ./nodetools inventory import /path/to/hosts.list --apply  # 确认后写入
# 导入会保留 hosts.list 首列的 SMC/AVR 标签，例如 SMC-L1POD2。
#
# 1. 定义节点。每台一行，host= 管理口 BMC 地址。
#    知道硬件信息时可填写 platform、oem、generation；未知可省略。
[compute]
HGX531 host=192.0.2.31 platform=hgx oem=smc generation=b300
HGX532 host=192.0.2.32 platform=hgx oem=smc generation=b300
HGX390 host=192.0.2.39

# 2. 按现场标签分组。可逐台写，也可用范围写在一行。
#    组成员必须在库存里有节点定义。BMC 地址及参数写在节点定义上。
#    一台可以同时属于硬件组、POD 组和巡检组。
[SMC-L1POD2]
HGX[531-532]

[AVR-L5POD4]
HGX390

[L1]
HGX[531-532]

# 3. 有一批同配置的机器时，用 :vars 共享硬件信息。
#    自定义硬件组要设置 role=compute；只用于选择的 POD 组只写成员。
[dell_nvl]
dell-nvl-01 host=192.0.2.20
dell-nvl-02 host=192.0.2.21

[dell_nvl:vars]
role=compute
platform=nvl
oem=dell
generation=gb300

# 4. 管理账号。取消注释并填写本环境值。
#    优先级：全局 < 组变量 < 节点行上的值。
[all:vars]
# bmc_user=your-bmc-user
# bmc_password=your-bmc-password

# NVL 环境可按需添加 NVSwitch 和 PowerShelf。
# [nvswitch]
# fabric-01 host=192.0.2.41 oem=nvidia generation=gb300
# [nvswitch:vars]
# nvswitch_bmc_user=your-switch-bmc-user
# nvswitch_bmc_password=your-switch-bmc-password
# [powershelf]
# shelf-01 host=192.0.2.51 oem=liteon generation=gb300
# [powershelf:vars]
# powershelf_bmc_user=your-shelf-bmc-user
# powershelf_bmc_password=your-shelf-bmc-password
#
# IB/SPX 交换机走 SSH，可用于 ibswhc、spxswhc、ibswmon、spxswmon。
# [switch]
# ib-leaf01 host=192.0.2.61 ssh_user=ops
# spx-leaf01 host=192.0.2.71 ssh_user=ops

# 高级选项，按需启用。
# 已确认 Redfish 资源时，可在节点行设置 system_id、manager_id、chassis_id。
# chassis_id 会限制传感器采集范围；只想限定温度时用 temp_chassis_id。
# 已知单相供电的电压和功率因数时，可在节点或组变量设置：
# psu_input_volts=230
# psu_input_power_factor=0.95

[nodehealth:defaults]
jobs=18
timeout=10
node_timeout=30
summary=false
