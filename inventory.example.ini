# Choose a platform-specific inventory template:
# HGX B200/B300: inventory.hgx.example.ini (SMC / AVR and POD groups)
# NVL GB200/GB300: inventory.nvl.example.ini (Wistron, NVSwitch, power shelf)
#
# cp inventory.hgx.example.ini inventory.ini
# or:
# cp inventory.nvl.example.ini inventory.ini
#
# Replace addresses and CHANGE_ME credentials before querying hardware.
# For an existing inventory, preview imports before applying:
# ./nodetools inventory import host.list
# ./nodetools inventory import host.list --apply
