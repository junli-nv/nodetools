# nodetools inventory template.
#
# Copy to inventory.ini and adjust. Each host lives in a role group and carries
# its BMC address via `host=`. Group `:vars` provide role-scoped credentials;
# per-host `key=value` tokens override them.
#
# Hardware identity:
#   role=compute | nvswitch | powershelf (inferred from the role group)
#   platform=hgx (B200/B300) | nvl (GB200/GB300)
#   oem=dell | lenovo | smc | aivres | compal | netweb | ...
# Omit platform and oem to use BMC detection. Set them per hardware group
# or per host. Custom hardware groups can set role in their :vars section.
# The Dell groups below use documentation-only IP addresses.
#
# Role groups: compute | nvswitch | powershelf
# Address keys accepted: host= | bmc_ip= | ansible_host= | ip= (or a bare 2nd token)
#
# Variable precedence: [all:vars] < group :vars < per-host inline.

[compute]
# vdc1-pro2-t10-gpu-cp-01 host=10.10.0.1
# vdc1-pro2-t10-gpu-cp-[02-18] is NOT valid here (ranges cannot carry IPs);
# list every host explicitly, or generate this file from hosts.list.
# Per-host identity in a mixed compute group:
dell-hgx-02 host=192.0.2.11 platform=hgx oem=dell

[nvswitch]
# vdc1-pro2-t10-gpu-nvl-01 host=10.10.1.1

[powershelf]
# vdc1-pro2-t10-gpu-pwr-01 host=10.10.2.1

[dell_hgx]
dell-hgx-01 host=192.0.2.10

[dell_hgx:vars]
role=compute
platform=hgx
oem=dell

[dell_nvl]
dell-nvl-01 host=192.0.2.20

[dell_nvl:vars]
role=compute
platform=nvl
oem=dell

[all:vars]
bmc_user=root
bmc_password=0penBmc

[compute:vars]
bmc_user=root
bmc_password=0penBmc

[nvswitch:vars]
nvswitch_bmc_user=root
nvswitch_bmc_password=p@ssw0rd@NVSW

[powershelf:vars]
powershelf_bmc_user=root
powershelf_bmc_password=0penBmc

[nodehealth:defaults]
jobs=18
timeout=10
node_timeout=30
summary=false
