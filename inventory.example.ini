# nodetools inventory template.
#
# Copy to inventory.ini and adjust. Each host lives in a role group and carries
# its BMC address via `host=`. Group `:vars` provide role-scoped credentials;
# per-host `key=value` tokens override them.
#
# Hardware identity:
#   role=compute | nvswitch | powershelf (inferred from the role group)
#   platform=hgx (B200/B300) | nvl (GB200/GB300)
#   generation=b200 | b300 | gb200 | gb300
#   oem=dell | lenovo | wistron | smc | aivres | compal | netweb | ...
# For known hardware, set platform, oem and generation per hardware group
# or host. Supported commands use the matching adapter's known endpoints
# without a startup identity probe. Leave unknown values unset for discovery.
# Custom hardware groups set role in their :vars section.
# Set system_id/manager_id/chassis_id only to scope commands to a known
# resource. Use the final URI segment. A chassis_id scopes sensor commands
# to one chassis, so leave it unset for whole-tray fan, PSU and temperature data.
# Set temp_chassis_id=1 only after confirming that the chassis covers nodetemp.
# It applies to temperature reads and falls back to discovery when empty.
# Examples for NVL infrastructure. Replace the IDs with those from your BMC:
# [nvswitch]
# fabric-01 host=192.0.2.30 oem=nvidia generation=gb300 system_id=Fabric1
# [powershelf]
# shelf-01 host=192.0.2.30 oem=liteon generation=gb300 chassis_id=Shelf1 manager_id=PMC1
# Use verified identities. Uncomment a matching example and replace its host.
# [wistron_gb300]
# wistron-gb300-01 host=192.0.2.40
# [wistron_gb300:vars]
# role=compute
# platform=nvl
# oem=wistron
# generation=gb300
#
# [lenovo_gb300]
# lenovo-gb300-01 host=192.0.2.41
# [lenovo_gb300:vars]
# role=compute
# platform=nvl
# oem=lenovo
# generation=gb300
#
# [smc_hgx_b300]
# smc-hgx-b300-01 host=192.0.2.42
# [smc_hgx_b300:vars]
# role=compute
# platform=hgx
# oem=smc
# generation=b300
#
# The Dell groups below use documentation-only IP addresses.
#
# Role groups: compute | nvswitch | powershelf
# Address keys accepted: host= | bmc_ip= | ansible_host= | ip= (or a bare 2nd token)
#
# Variable precedence: [all:vars] < group :vars < per-host inline.

[compute]
# vdc1-pro2-t10-gpu-cp-01 host=10.10.0.1
# vdc1-pro2-t10-gpu-cp-[02-18] is NOT valid here (ranges cannot carry IPs);
# list every host explicitly, or generate this file from hosts.list.
# Per-host identity in a mixed compute group:
dell-hgx-02 host=192.0.2.11 platform=hgx oem=dell

[nvswitch]
# vdc1-pro2-t10-gpu-nvl-01 host=10.10.1.1

[powershelf]
# vdc1-pro2-t10-gpu-pwr-01 host=10.10.2.1

[dell_hgx]
dell-hgx-01 host=192.0.2.10

[dell_hgx:vars]
role=compute
platform=hgx
oem=dell

[dell_nvl]
dell-nvl-01 host=192.0.2.20

[dell_nvl:vars]
role=compute
platform=nvl
oem=dell

[all:vars]
bmc_user=root
bmc_password=0penBmc

[compute:vars]
bmc_user=root
bmc_password=0penBmc

[nvswitch:vars]
nvswitch_bmc_user=root
nvswitch_bmc_password=p@ssw0rd@NVSW

[powershelf:vars]
powershelf_bmc_user=root
powershelf_bmc_password=0penBmc

[nodehealth:defaults]
jobs=18
timeout=10
node_timeout=30
summary=false

# Optional nodemon fallback settings for a known single-phase feed.
# Set at group or host level if the feed differs.
# psu_input_volts=230
# psu_input_power_factor=0.95

# Optional SSH targets for ibswhc, spxswhc, ibswmon, and spxswmon.
# [switch]
# ib-leaf01 host=192.0.2.61 ssh_user=ops
# spx-leaf01 host=192.0.2.71 ssh_user=ops
