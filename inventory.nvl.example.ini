# NVL GB200/GB300 example, based on inventory.nvl.ini (Wistron).
# Optional credentials template (no BCM required): ./gen_passwd.sh -o passwd.sh
# Fill credentials, then:
# ./nodetools inventory init --from hosts.list --passwd-file passwd.sh -o inventory.generated.ini
# Optional BCM host export: ./gen_hosts.sh -o hosts.bcm.list
# For the older generation, set generation=gb200 and verify model-specific resources.
# cp inventory.nvl.example.ini inventory.ini
# Replace example addresses and CHANGE_ME credentials for all three roles.
# ./nodelist --by-group
# ./nodepower vdc1-pro2-n03-gpu-cp-01 -x
# ./nvswtemp vdc1-pro2-n03-gpu-nvl-01
# ./pspsu vdc1-pro2-n03-gpu-pwr-01 --details
# ./nodetools inventory import host.list
# ./nodetools inventory import host.list --apply
# host.list: PhysicalNode NAME BMC_IP / Switch NAME BMC_IP / PowerShelf NAME BMC_IP
# Switch and NVSwitch labels import into [nvswitch], for any hostname.

[compute]
vdc1-pro2-n03-gpu-cp-01 host=192.0.2.11
vdc1-pro2-n03-gpu-cp-02 host=192.0.2.12

[compute:vars]
platform=nvl
generation=gb300
oem=wistron
# cmsh -> category gb200 -> bmcsettings (compute BMC, also used for IPMI)
bmc_user=root
bmc_password=CHANGE_ME_COMPUTE
# GB300 Bianca PDB host system; confirm against your model/firmware.
system_id=system

[nvswitch]
vdc1-pro2-n03-gpu-nvl-01 host=192.0.2.41 nvswitch_os_host=198.51.100.41
vdc1-pro2-n03-gpu-nvl-02 host=192.0.2.42 nvswitch_os_host=198.51.100.42

[nvswitch:vars]
platform=nvl
generation=gb300
oem=nvidia
# host= is the BMC address, used by power/eventlog/inventory.
# cmsh -> device/category nvswitch -> bmcsettings
nvswitch_bmc_user=root
nvswitch_bmc_password=CHANGE_ME_NVSWITCH_BMC
# nvswitch_os_host= is the NVOS SSH address, used by temp/psu.
# Without that override NVOS connects to the inventory hostname.
# cmsh -> device nvswitch -> accesssettings
# NVOS login is used by nvswtemp and nvswpsu.
nvswitch_os_user=admin
nvswitch_os_password=CHANGE_ME_NVOS

[powershelf]
vdc1-pro2-n03-gpu-pwr-01 host=192.0.2.51
vdc1-pro2-n03-gpu-pwr-02 host=192.0.2.52

[powershelf:vars]
platform=nvl
generation=gb300
# cmsh -> device powershelf -> bmcsettings
powershelf_bmc_user=root
powershelf_bmc_password=CHANGE_ME_POWERSHELF
# Set OEM from the shelf itself, not from the compute-tray manufacturer.
# For verified Lite-On PF-1333-9RB shelves:
# oem=liteon
# chassis_id=powershelf
# manager_id=bmc

[rack-n03]
vdc1-pro2-n03-gpu-cp-[01-02]
vdc1-pro2-n03-gpu-nvl-[01-02]
vdc1-pro2-n03-gpu-pwr-[01-02]

# IB / Ethernet fabric switches use OS management addresses, not NVLink BMCs.
# host.list import examples:
# IBSwitch ib-leaf01 192.0.2.61
# EthernetSwitch eth-leaf01 192.0.2.62
# SPXSwitch spx-leaf01 192.0.2.63
# Use NVSwitch for NVLink trays; Switch is its legacy import alias.
[switch]
ib-leaf01 host=192.0.2.61 ssh_user=admin
eth-leaf01 host=192.0.2.62 ssh_user=admin
spx-leaf01 host=192.0.2.63 ssh_user=cumulus

# SSH authentication uses the local OpenSSH configuration/keys.
# IB: ./ibswhc ib-leaf01 / ./ibswmon ib-leaf01
# Spectrum-X Ethernet: ./spxswhc spx-leaf01 / ./spxswmon spx-leaf01
# Other Ethernet platforms need their own command/backend adaptation.

[nodehealth:defaults]
jobs=18
timeout=10
node_timeout=30
redfish_timeout=8
redfish_connect_timeout=3
summary=false
