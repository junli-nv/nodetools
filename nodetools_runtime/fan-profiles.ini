# Fixed IPMI raw fan sequences. One command per indented line.
# Built-in sections are selected by their existing OEM adapter.
# Bytes are NetFn, command, then any command-specific data.

[DEFAULT]
# Seconds to wait for an IPMI LAN response (ipmitool -N).
ipmi_timeout = 8
ipmi_retries = 1

