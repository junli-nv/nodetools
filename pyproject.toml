[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nodetools"
version = "0.1.0"
description = "Inspect GB200/GB300 nodes over Redfish and IPMI"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "junli-nv", email = "junliz@nvidia.com" }]
dependencies = ["requests>=2.20"]

[project.scripts]
nodetools = "nodetools_runtime.cli:main"
nodelist = "nodetools_runtime.cli:main"
nodeping = "nodetools_runtime.cli:main"
nodefan = "nodetools_runtime.cli:main"
nodepsu = "nodetools_runtime.cli:main"
nodetemp = "nodetools_runtime.cli:main"
nvswfan = "nodetools_runtime.cli:main"
nvswpsu = "nodetools_runtime.cli:main"
nvswtemp = "nodetools_runtime.cli:main"
psfan = "nodetools_runtime.cli:main"
pspsu = "nodetools_runtime.cli:main"
pstemp = "nodetools_runtime.cli:main"
nodepower = "nodetools_runtime.cli:main"
nodeeventlog = "nodetools_runtime.cli:main"
nodeinventory = "nodetools_runtime.cli:main"
nvswpower = "nodetools_runtime.cli:main"
nvsweventlog = "nodetools_runtime.cli:main"
nvswinventory = "nodetools_runtime.cli:main"
pspower = "nodetools_runtime.cli:main"
pseventlog = "nodetools_runtime.cli:main"
psinventory = "nodetools_runtime.cli:main"
nodeboot = "nodetools_runtime.cli:main"
nodebootorder = "nodetools_runtime.cli:main"
nodenetboot = "nodetools_runtime.cli:main"
nodemacs = "nodetools_runtime.cli:main"
nodebios = "nodetools_runtime.cli:main"
nodevm = "nodetools_runtime.cli:main"
nodeconsole = "nodetools_runtime.cli:main"

[tool.setuptools]
packages = ["nodetools_runtime", "nodetools_runtime.transport", "nodetools_runtime.caps", "nodetools_runtime.oem", "nodetools_runtime.subjects"]

[tool.pytest.ini_options]
testpaths = ["tests"]
