[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nodetools"
version = "0.1.0"
description = "Inspect GB200/GB300 nodes over Redfish and IPMI"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "junli-nv", email = "junliz@nvidia.com" }]
dependencies = ["requests>=2.20"]

[project.scripts]
nodetools = "nodetools_runtime.cli:main"

[tool.setuptools]
packages = ["nodetools_runtime", "nodetools_runtime.transport", "nodetools_runtime.caps", "nodetools_runtime.oem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
